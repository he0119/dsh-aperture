# Release Drafter 配置：PR 合并进 main 后自动把改动整理进下一个 Release 草稿。
#
# 本仓库的 PR 标题就是约定式提交（feat(panel)!: … / fix(ci): …），所以分类直接读标题里的
# type / scope / 破坏性标记，不需要先打标签；标签只留三个人工开关：
#   - major / minor：强制版本升幅（多个规则命中时取最高）；
#   - skip-changelog：这条 PR 整个不进草稿。
# 另外 autolabeler 会按标题与分支名自动补 enhancement / bug / …，方便人筛 PR。

# 草稿标题与标签都用算出来的下一版本号；发布草稿时生成 v* 标签，
# 于是 Publish 工作流（push v* 标签触发）接手发 npm。
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # 带 ! 的提交（如 feat(panel)!: …）只进这一节；exclusive 挡住下面几节重复收录。
  - title: '💥 破坏性变更'
    semver-increment: major
    exclusive: true
    when:
      - conventional:
          breaking: true
      - label: 'breaking-change'

  # chore(deps): / build(deps): 这类，以及 dependabot、renovate 的分支名。
  - title: '⬆️ 依赖更新'
    collapse-after: 0
    exclusive: true
    when:
      - conventional:
          scopes: ['deps', 'deps-dev']
      - label: 'dependencies'

  - title: '✨ 新功能'
    semver-increment: minor
    exclusive: true
    when:
      - conventional:
          type: 'feat'
      - label: 'enhancement'

  # 下面三节的 semver-increment 用默认值 patch。
  - title: '🐛 修复'
    exclusive: true
    when:
      - conventional:
          type: 'fix'
      - label: 'bug'

  - title: '📖 文档'
    exclusive: true
    when:
      - conventional:
          type: 'docs'
      - label: 'documentation'

  # 兜底：不写 when 的分类只接住上面都没匹配到的改动
  # （chore / ci / build / refactor / test / perf … 都落这里）。
  - title: '🧰 维护'

  # 下面几条不渲染章节，只参与算 $RESOLVED_VERSION：
  # 给 PR 贴 major / minor 标签强制升版本（最高升幅胜出，
  # 例如落在 ✨ 新功能 里的 PR 贴了 major 也按 major 升）。
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      label: 'minor'
  # 什么都没命中时按 patch 升。
  - type: 'version-resolver'
    semver-increment: 'patch'

  # 带 skip-changelog 标签的 PR 不进草稿。
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

change-template: '- $TITLE (#$NUMBER) $AUTHORS'
# 防止 $TITLE 里的字符被当成 Markdown 排版（@ 与 # 由它另行中和，避免误 at 全体）。
change-title-escapes: '\<*_&'

template: |
  ## 变更内容

  $CHANGES

# 按 PR 标题（约定式提交）与分支名自动补标签。由工作流里的 autolabeler 步骤执行；
# 每条规则的 title / branch / body / files 各自独立匹配，命中任意一个就打上标签。
autolabeler:
  - label: 'breaking-change'
    title: ['/^[a-z]+(\([^)]*\))?!:/i']
  - label: 'enhancement'
    title: ['/^feat(\([^)]*\))?:/i']
  - label: 'bug'
    title: ['/^fix(\([^)]*\))?:/i']
  - label: 'documentation'
    title: ['/^docs(\([^)]*\))?:/i']
  - label: 'chore'
    title: ['/^(chore|ci|build|refactor|test|style|perf)(\([^)]*\))?:/i']
  - label: 'dependencies'
    title: ['/^(chore|build|fix)\(deps(-dev)?\):/i']
    branch: ['/^dependabot\//', '/^renovate\//']
