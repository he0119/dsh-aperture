name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # 这里不能再写 if 过滤：on.push.branches 已经让标签推送不触发本工作流，
    # 而 Publish 以 workflow_call 调进来时 github 上下文仍属于调用方（tag push），
    # 任何形如「push 到标签就跳过」的条件都会把发布前的这道检查一起跳过。
    #
    # 显式声明 contents: read：以 workflow_call 被 Publish 复用时，写在这里的权限对调用方也成立，
    # 不必去指望仓库级的默认令牌权限。
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # v5 起这两个动作跑在 Node 24 上；v4 在 runner 上只会被警告降级执行。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 只测 Node 24：engines 下限就是 24，且 test 脚本用的 --test-isolation=none
          # 在 Node 22 上不存在（node: bad option，退出码 9）。
          node-version: 24
          cache: npm
      # 仓库不带原生依赖，安装是为了拿到 typescript 与各 @deepseek-ai/* 类型声明。
      - run: npm ci
      # test/ 含 .ts 用例，靠 node 自带的类型擦除运行，因此这一步同时是「类型没坏」的证明。
      # 端到端那一份也在 glob 里（test/live.test.ts）：它连的网关由 test/fake-gateway.ts 自己起，
      # 不写死端口、不要网络，因此这里不需要 DSH_APERTURE_LIVE_URL，也不必单独一步。
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
