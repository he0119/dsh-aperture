name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # 推标签时 Publish 会以 workflow_call 复用这个 job，这里就不必再独立跑一遍。
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # v5 起这两个动作跑在 Node 24 上；v4 在 runner 上只会被警告降级执行。
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 只测 Node 24：engines 下限就是 24，且 test 脚本用的 --test-isolation=none
          # 在 Node 22 上不存在（node: bad option，退出码 9）。
          node-version: 24
          cache: npm
      # 仓库不带原生依赖，安装是为了拿到 typescript 与各 @deepseek-ai/* 类型声明。
      - run: npm ci
      # test/ 含 .ts 用例，靠 node 自带的类型擦除运行，因此这一步同时是「类型没坏」的证明。
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
