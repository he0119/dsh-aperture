# dsh-aperture 的 bundle patch：在 profile 里装上这个包就够了。`dsh plugin --profile web
# add dsh-aperture` 会协调 `dsh.profile.bundles`，这段 insert 负责加行；启动前可以用
# `dsh --profile web --dump-config` 看组合结果，里面会出现 "# == dsh-aperture" 这一层。
#
# 这一行**故意不写 `config`**。用户层是 profile 的补丁文档
# （`$DSH_HOME/profiles/<profile>/cordis.patch.yml`，即「插件」页里点「配置」后编辑的那个
# 文件），而更靠后的 patch 层整行替换 `config`、不深度合并：缺省值摆在组合层，用户层里就会
# 连带出现一堆没人写过的键——配置页上「已覆盖」的判据正是「键出现在用户层里」，它们会让标签
# 凭空冒出来，也会在新版本改动某个缺省值时把它钉死在用户文件里。缺省值只有一处：
# `src/config.ts` 的 schema。
#
# 要改哪个键就在用户层写 `config:`，没写的回落缺省值；下面没列的 headers、enabledModelIds、
# modelAliases、models 见 README.md。
#
#   - id: aperture
#     config:
#       # Aperture 实例根地址，例如 https://ai.example.ts.net——必填；`/v1` 由插件追加，
#       # 自带结尾的 `/v1` 会被剥掉；留空则插件照常挂载但休眠，不发现也不写入。
#       baseUrl: ''
#       # 本插件拥有的两条路由的前缀：通告了 `/v1/chat/completions` 的模型走 `route`，
#       # 通告了 `/v1/messages` 的走 `<route>-anthropic`；两者都没有的模型不发布。
#       route: aperture
#       # 凭据引用，由凭据服务接缝按请求解析；网关靠网络身份认证（Tailscale）时留空，
#       # 插件只写入 pi-ai 要求的占位请求头，不保存任何密钥。
#       apiKeyEnv: ''
#       # `auto` 把模型的推理能力映射成 reasoningEfforts；`off` 声明都不推理。
#       reasoning: auto
#       # `ignore` 声明纯文本；`metadata` 接受 models.dev 为某些模型声明的图片模态。
#       images: ignore
#       # 补齐 Aperture 没说明的部分的 models.dev 清单；空串关闭这次拉取，发现不受影响。
#       modelMetadataUrl: 'https://models.dev/models.json'
#       # 是否把发现的模型清单写进 llm-pi-ai 设置段；false = 只发现不写入。
#       sync: true
#       # 自动刷新间隔（分钟）；0（默认）= 只在加载、配置变更与配置页「立即刷新」时刷新。
#       refreshIntervalMinutes: 0
- insert:
    - id: aperture
      name: 'dsh-aperture'
