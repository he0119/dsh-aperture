# 本仓库只有一个包，所以这里没有 `packages:` —— 这个文件只承载 pnpm 的设置。
# pnpm 10+ 起，pnpm 自己的设置以 pnpm-workspace.yaml 为准，写进 .npmrc 不再生效
# （实测：.npmrc 里写 node-linker，`pnpm config get node-linker` 仍然是 undefined）。
#
# pnpm 10+ 默认拦住任何自带安装/构建脚本的依赖（strictDepBuilds 默认就是开着的）：
# 不在 allowBuilds 里的脚本会让 install 以非零码退出，并顺手生成下面这份待填的模板。
# 两个都显式拒绝，且都核对过原因：
#   @google/genai —— package.json 的 prepare 指向 scripts/prepare.js，但 files 白名单里
#                    根本没有 scripts/（发布出去的包只有 dist/ 与 node/、web/），
#                    放行只会让 install 报「找不到模块」；
#   protobufjs    —— postinstall 只在依赖方用了不匹配的 versionScheme 时打印一行警告，
#                    本仓库不涉及，属于空转。
# 官方 DSH 的 pnpm-workspace.yaml 对这两个包同样写 false（理由也一样：空转的脚本）。
allowBuilds:
  '@google/genai': false
  protobufjs: false
